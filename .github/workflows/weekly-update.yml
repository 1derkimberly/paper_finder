# Weekly automatic update for the deployed dashboard: searches every topic, has Claude judge new papers,
# and writes everything to the Postgres database the Streamlit app reads (secrets set in the GitHub repo).
name: weekly-update

on:
  schedule:
    # Monday and Thursday 00:00 UTC = 09:00 KST. Twice a week also keeps a free Supabase project from pausing
    # (it pauses after 7 days without activity).
    - cron: "0 0 * * 1,4"
  workflow_dispatch: {}        # "Run workflow" button for a manual run

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update all topics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          PYTHONIOENCODING: utf-8
        run: python -m paper_finder update --trigger schedule
