[server]
runOnSave = false

[client]
# pages/privacy.py is reached by its URL (/privacy) and the sidebar link, not a page menu
showSidebarNavigation = false

[theme]
# One accent (blue) that matches the chart bars; Korean-friendly font.
font = "Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"
headingFont = "Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"
fontFaces = [
  { family = "Pretendard", url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2", weight = 400 },
  { family = "Pretendard", url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2", weight = 600 },
  { family = "Pretendard", url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2", weight = 700 },
]
baseFontSize = 15
headingFontWeights = [700, 650, 600]
headingFontSizes = ["2rem", "1.4rem", "1.15rem"]
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

# Indigo accent on soft off-white / ink surfaces (no pure #fff / #000). Accent = chart bar colour (app.bar_color).
[theme.light]
primaryColor = "#5b5bd6"
backgroundColor = "#fbfbfd"
secondaryBackgroundColor = "#f1f2f7"
textColor = "#1c1d29"
linkColor = "#4f4fc7"
borderColor = "#e3e4ec"

[theme.light.sidebar]
backgroundColor = "#f4f4f9"
borderColor = "#e6e7ee"

[theme.dark]
primaryColor = "#7072f2"
backgroundColor = "#111218"
secondaryBackgroundColor = "#1b1c25"
textColor = "#e8e8f0"
linkColor = "#a5a7fa"
borderColor = "#2a2c38"

[theme.dark.sidebar]
backgroundColor = "#15161e"
borderColor = "#262833"
